title: Host-Based Rootkit Anomaly Detected (Wazuh Rootcheck)
id: 39595511-eb23-403c-b2f2-39bb49f7b086
status: test
description: |
    Detects a rootcheck anomaly indicating a possible kernel-level
    rootkit or trojaned system binary (e.g. netstat) hiding activity.
    NOTE: this is a meta-detection layered on Wazuh's own rootcheck
    module output, not a raw OS log source — rootcheck performs its
    own internal heuristic scanning that has no equivalent structured
    log format outside Wazuh. This rule detects on Wazuh's alert
    output (rule 510 -> custom rule 100101), not on a native syslog/
    auth/process-creation event. Tested end-to-end with a confirmed
    real, recurring trigger (not synthetic).
references:
    - https://attack.mitre.org/techniques/T1014/
    - https://documentation.wazuh.com/current/user-manual/capabilities/malware-detection/index.html
author: Emilio Rodriguez
date: 2026-08-08
tags:
    - attack.defense-evasion
    - attack.t1014
logsource:
    product: wazuh
    service: rootcheck
detection:
    selection:
        rule.id: 510
        rule.description|contains: 'rootkit'
    condition: selection
falsepositives:
    - Rootcheck heuristics can false-positive on legitimate software that
      binds to unusual ports or modifies system binaries during install
level: high
